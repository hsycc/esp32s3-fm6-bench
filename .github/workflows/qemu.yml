name: QEMU Main Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qemu-fm6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp32s3-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: espressif/idf:v6.0.3

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage Felucca FM6
        run: python3 tools/import_felucca.py

      - name: Configure and build ESP32-S3 QEMU image
        env:
          FM6_QEMU_CI: "1"
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Run QEMU FM6 validation
        run: |
          source /opt/esp/idf/export.sh
          set -euo pipefail
          : > qemu.log

          setsid idf.py qemu > qemu.log 2>&1 &
          qpid=$!
          complete=0

          for _ in $(seq 1 180); do
            if grep -q "=== benchmark complete ===" qemu.log; then
              complete=1
              break
            fi
            if ! kill -0 "$qpid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -TERM -- "-$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true

          cat qemu.log

          if [[ "$complete" != "1" ]]; then
            echo "QEMU benchmark did not complete within the validation window"
            exit 1
          fi

          python3 tools/check_dx7_layout_log.py qemu.log
          python3 tools/check_dx7_patch_log.py qemu.log
          python3 tools/check_dx7_import_log.py qemu.log
          python3 tools/check_dx7_import_stress_log.py qemu.log
          python3 tools/check_fm6_program_queue_log.py qemu.log
          python3 tools/check_fm6_program_queue_dualcore_log.py qemu.log
          python3 tools/check_fm6_program_queue_wrap_log.py qemu.log
          python3 tools/check_fm6_audio_runtime_log.py qemu.log
          python3 tools/check_qemu_log.py qemu.log

      - name: Publish QEMU summary
        if: always()
        run: |
          {
            echo '## ESP32-S3 FM6 QEMU validation'
            echo
            echo 'QEMU is the primary project gate. Timing below is emulator-only and is used for version-to-version regression, not as physical ESP32-S3 performance.'
            echo
            echo '```text'
            grep -E 'QEMU_DX7_LAYOUT|DX7_LAYOUT_LOG_CHECK|QEMU_DX7_PATCH|QEMU_DX7_BANK_RENDER|DX7_PATCH_LOG_CHECK|DX7_PATCH_RENDER|QEMU_DX7_IMPORT|DX7_IMPORT_LOG_CHECK|DX7_IMPORT_RENDER|DX7_IMPORT_STRESS|DX7_IMPORT_FUZZ|QEMU_FM6_PROGRAM_QUEUE|FM6_PROGRAM_QUEUE_SWITCH|FM6_PROGRAM_QUEUE_LOG_CHECK|QEMU_FM6_PROGRAM_QUEUE_DUALCORE|FM6_PROGRAM_QUEUE_DUALCORE|FM6_PROGRAM_QUEUE_DUALCORE_LOG_CHECK|QEMU_FM6_PROGRAM_QUEUE_WRAP|FM6_PROGRAM_QUEUE_WRAP_RESULT|FM6_PROGRAM_QUEUE_WRAP_LOG_CHECK|QEMU_FM6_AUDIO_RUNTIME|FM6_AUDIO_RUNTIME_SEQUENCE|FM6_AUDIO_RUNTIME_LOG_CHECK|worst scan result:|QEMU_DETERMINISM|QEMU_FEATURE_MATRIX|QEMU_SOAK|QEMU_EVENT_STRESS|QEMU_RESULT|QEMU_VALIDATION|QEMU_LOG_CHECK' qemu.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-qemu-log
          path: qemu.log
          if-no-files-found: ignore
