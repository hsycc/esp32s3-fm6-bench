name: QEMU Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  esp32s3-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: espressif/idf:v6.0.3

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage Felucca FM6
        run: python3 tools/import_felucca.py

      - name: Configure and build ESP32-S3 QEMU image
        env:
          FM6_QEMU_CI: "1"
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Run QEMU functional validation
        run: |
          source /opt/esp/idf/export.sh
          set -uo pipefail
          : > qemu.log

          setsid idf.py qemu > qemu.log 2>&1 &
          qpid=$!
          complete=0

          for _ in $(seq 1 120); do
            if grep -q "=== benchmark complete ===" qemu.log; then
              complete=1
              break
            fi
            if ! kill -0 "$qpid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          # Kill the whole process group so idf.py and its QEMU child both stop.
          kill -TERM -- "-$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true

          cat qemu.log

          if [[ "$complete" != "1" ]]; then
            echo "QEMU benchmark did not complete within the validation window"
            exit 1
          fi

          grep -q "QEMU_MODE=1" qemu.log
          grep -q "QEMU_VALIDATION: PASS failures=0" qemu.log
          grep -q "=== benchmark complete ===" qemu.log

          if grep -Eq "QEMU_VALIDATION: FAIL|FUNCTIONAL_FAIL|Guru Meditation|assert failed|panic'ed" qemu.log; then
            echo "QEMU log contains a failure marker"
            exit 1
          fi

          echo "ESP32-S3 QEMU functional validation passed."

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-qemu-log
          path: qemu.log
          if-no-files-found: ignore
